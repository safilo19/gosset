[pytest]
testpaths = backend/tests
# rootdir on sys.path, so `import backend.core...` works without installing the package.
pythonpath = .
addopts = -q --strict-markers --tb=short
filterwarnings =
    # statsmodels' small-sample and convergence chatter is expected in several reference fits
    # (Longley is deliberately ill-conditioned; the mixed models are small on purpose).
    ignore::FutureWarning
    ignore::DeprecationWarning
markers =
    nist: validated against a NIST StRD certified dataset
    published: validated against a published worked example with a citation
    snapshot: fixed-seed golden snapshot of a stochastic procedure
    properties: invariants that must hold for any input or seed
    slow: takes more than a couple of seconds
