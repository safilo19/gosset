name: Release

# Tag-driven: pushing v1.0.0 builds the Windows installer and publishes it as a GitHub Release.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The tag is checked against desktop/package.json before anything is built (see the guard step). That
# field is the single source of truth for the version — it stamps the installer filename, the About
# window and the PDF footers — so a tag that disagrees with it would produce a release whose asset
# name and whose in-app version differ. Failing in ten seconds is better than discovering it after a
# twelve-minute build.
on:
  push:
    tags:
      - 'v*'
  # Buildable without tagging, to check the workflow itself. Produces an artifact, not a Release.
  workflow_dispatch:

permissions:
  contents: write # required to create the Release and upload assets

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # 3.11 deliberately, not "latest": requirements.txt is pinned to the versions tested on 3.11,
      # and several of them have no wheels for the newest Python — a resolver left to its own devices
      # is how a release ships a subtly different scipy from the one the analyses were verified
      # against.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Check the tag matches desktop/package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./desktop/package.json').version")"
          echo "tag=$tag  package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match desktop/package.json version $pkg."
            echo "::error::Bump the version field, run \`npm run stamp\` in desktop/, commit, then re-tag."
            exit 1
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Install Node dependencies
        working-directory: desktop
        run: npm ci

      # Fails if backend/version.py or frontend/brand/version.js has drifted from package.json,
      # rather than silently building an app whose About window shows the wrong number.
      - name: Check the version stamp is committed
        working-directory: desktop
        run: npm run stamp -- --check

      - name: Generate icons from the brand mark
        working-directory: desktop
        run: npm run icons

      - name: Freeze the Python backend (PyInstaller)
        working-directory: desktop
        run: npm run build:sidecar

      # The build's own guard: prove the frozen backend actually serves and that every heavy
      # dependency imports, BEFORE wrapping it in an installer. PyInstaller reports success for a
      # bundle whose statsmodels or reportlab is missing a hidden import; that only shows up when the
      # code path runs. Catching it here rather than in a user's bug report is the whole point.
      - name: Smoke-test the frozen backend
        shell: bash
        run: |
          exe="$LOCALAPPDATA/gosset-build/sidecar/gosset-sidecar/gosset-sidecar.exe"
          "$exe" --port 8199 --output-dir "$RUNNER_TEMP/gosset-out" &
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8199/health >/dev/null && break
            sleep 2
          done
          python desktop/scripts/smoke_sidecar.py http://127.0.0.1:8199

      # REQUIRED, not defensive. electron-builder fetches its winCodeSign toolchain even for an
      # unsigned build, and that archive carries macOS symlinks whose extraction needs a privilege a
      # Windows runner does not have — so the build dies after four retries on
      # "Cannot create symbolic link ... libcrypto.dylib". Seeding the cache ourselves without the
      # darwin tree (which a Windows build never touches) is the only thing that avoids it:
      # CSC_IDENTITY_AUTO_DISCOVERY=false and a no-op `sign` hook were both tried and neither stops
      # the download.
      - name: Pre-seed the electron-builder signing cache
        shell: pwsh
        run: |
          $cache = Join-Path $env:LOCALAPPDATA 'electron-builder\Cache\winCodeSign'
          New-Item -ItemType Directory -Force $cache | Out-Null
          $archive = Join-Path $cache 'winCodeSign-2.6.0.7z'
          $target  = Join-Path $cache 'winCodeSign-2.6.0'
          if (-not (Test-Path $target)) {
            Invoke-WebRequest -UseBasicParsing `
              -Uri 'https://github.com/electron-userland/electron-builder-binaries/releases/download/winCodeSign-2.6.0/winCodeSign-2.6.0.7z' `
              -OutFile $archive
            & 7z x $archive "-o$target" '-xr!darwin' -bso0 -bsp0
          }
          if (Test-Path (Join-Path $target 'windows-10\x64\signtool.exe')) {
            Write-Host 'winCodeSign cache seeded'
          } else {
            # Fail loudly. A silent warning here means the next step fails for a reason that LOOKS
            # unrelated, and its real cause is three steps back and green.
            Write-Host '::error::winCodeSign cache seeding did not produce signtool.exe'
            exit 1
          }

      - name: Build the installer and publish the update feed
        working-directory: desktop
        # Unsigned on purpose — see the README. Left explicit so a future signing setup is one
        # secret and one line, not an archaeology exercise.
        #
        # `--publish always` on a tag, `never` otherwise, so a workflow_dispatch run can be used to
        # test the build without creating a release. electron-builder does the uploading here rather
        # than a separate action, because it has to upload THREE files that belong together — the
        # installer, its .blockmap and latest.yml — and latest.yml is the file every installed copy
        # polls to discover the release. Uploading the .exe alone produces a release users can
        # download by hand and no existing install will ever notice.
        #
        # GH_TOKEN is required for that upload, and is the repository-scoped token Actions provides;
        # no personal token exists in this repo. An earlier revision passed this token while ALSO
        # saying `--publish never`, with no publish provider configured — a combination that has
        # nothing to resolve, and the step failed. It is consistent now.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        # The output is echoed back as ::error:: annotations on failure, NOT just left in the log.
        # Workflow logs need an authenticated request; annotations do not. So when this step fails,
        # the reason is visible to anyone who can see the repository — including whoever is debugging
        # it from outside CI, which is exactly the situation that made a previous failure here take
        # three blind ten-minute iterations to chase.
        run: |
          # Actions runs pwsh with $ErrorActionPreference='Stop', and electron-builder writes its
          # entire progress log to stderr. Without this, the first ordinary progress line would be
          # promoted to a terminating error and the step would die before the build even got going —
          # a self-inflicted failure that looks exactly like the one being diagnosed.
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:RUNNER_TEMP 'electron-builder.log'
          $publish = if ($env:GITHUB_REF -like 'refs/tags/v*') { 'always' } else { 'never' }
          Write-Host "electron-builder --publish $publish"
          & npx electron-builder --config electron-builder.config.cjs --publish $publish *>&1 |
            Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "::group::electron-builder failed (exit $code)"
            # Annotations are capped, so send the tail — the useful end — a line at a time, with the
            # characters Actions treats as control sequences escaped.
            Get-Content "$env:RUNNER_TEMP\electron-builder.log" -Tail 30 | ForEach-Object {
              $line = $_ -replace '%', '%25' -replace "`r", ''
              if ($line.Trim()) { Write-Host "::error::$line" }
            }
            Write-Host '::endgroup::'
            exit $code
          }

      # The update feed is the whole point of the publish provider, so its absence must fail the build
      # rather than produce a release that silently cannot be auto-updated from.
      - name: Check the update feed was produced
        id: collect
        shell: bash
        run: |
          out="$LOCALAPPDATA/gosset-build/electron"
          mkdir -p artifacts
          cp "$out"/Gosset-Setup-*.exe artifacts/
          cp "$out"/*.blockmap artifacts/ 2>/dev/null || true
          cp "$out"/latest.yml artifacts/ 2>/dev/null || true
          ls -l artifacts

          missing=""
          [ -f "$out"/latest.yml ] || missing="$missing latest.yml"
          ls "$out"/Gosset-Setup-*.exe.blockmap >/dev/null 2>&1 || missing="$missing *.exe.blockmap"
          if [ -n "$missing" ]; then
            echo "::error::electron-builder produced no$missing — electron-updater cannot discover this release. Check the publish provider in desktop/electron-builder.config.cjs."
            exit 1
          fi
          echo "--- latest.yml ---"
          cat "$out"/latest.yml
          echo "name=$(basename artifacts/Gosset-Setup-*.exe)" >> "$GITHUB_OUTPUT"

      # Always uploaded, so a workflow_dispatch run (no tag, no Release) still produces something
      # downloadable to test.
      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.name }}
          path: artifacts/*.exe
          if-no-files-found: error
          retention-days: 30

      # electron-builder has already created the release and attached all three files. What it cannot
      # do is write good release notes, so the body is replaced with this version's CHANGELOG section —
      # the same text the app shows in its "What's new" window. One changelog, two surfaces.
      - name: Write the release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(node desktop/scripts/release-notes.mjs "$version")"
          if [ -z "$notes" ]; then
            echo "::error::CHANGELOG.md has no [$version] section, so the release would have no notes."
            exit 1
          fi
          printf '%s\n' "$notes" > "$RUNNER_TEMP/notes.md"
          echo "--- release body ---"; cat "$RUNNER_TEMP/notes.md"

          # The release already exists (electron-builder made it); PATCH its body by id.
          id="$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
                 "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
                 | python -c 'import sys,json; print(json.load(sys.stdin)["id"])')"
          python - "$id" <<'PY'
          import json, os, sys, urllib.request
          body = open(os.environ['RUNNER_TEMP'] + '/notes.md', encoding='utf-8').read()
          payload = json.dumps({'body': body, 'draft': False, 'name': f"Gosset {os.environ['GITHUB_REF_NAME']}"}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/releases/{sys.argv[1]}",
              data=payload, method='PATCH',
              headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                       'Accept': 'application/vnd.github+json',
                       'Content-Type': 'application/json'})
          with urllib.request.urlopen(req) as r:
              print('release updated:', json.load(r)['html_url'])
          PY
